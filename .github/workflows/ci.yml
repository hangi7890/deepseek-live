name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run smoke
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t deepseek-live-smoke .
      - name: Start demo container
        run: docker run -d --name deepseek-live-smoke -p 127.0.0.1:3000:3000 -e LIVE_ACCESS_TOKEN=ci-only-demo-access-token-32-characters deepseek-live-smoke
      - name: Verify container endpoints and auth
        run: npm run smoke -- --url http://127.0.0.1:3000
        env:
          SMOKE_ACCESS_TOKEN: ci-only-demo-access-token-32-characters
      - name: Stop test container
        if: always()
        run: docker rm -f deepseek-live-smoke || true
